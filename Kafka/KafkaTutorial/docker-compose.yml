version: '3.8'

networks:
  kafka_network:

volumes:
  Kafka00:
    driver: local

services:
  Kafka00Service:
    image: bitnami/kafka:3.7.0
    restart: unless-stopped
    container_name: Kafka00Container
    ports:
      - '9092:9092' # 내부 네트워크 통신을 위한 PLAINTEXT 리스너
    environment:
      # KRaft 설정
      KAFKA_ENABLE_KRAFT : "yes" # KRaft 모드 활성화
      KAFKA_CFG_BROKER_ID : "0"
      KAFKA_CFG_NODE_ID : "0"
      KAFKA_KRAFT_CLUSTER_ID : "HsDBs9l6UUmQq7Y5E6bNlw" # 고유 클러스터 ID, 모든 브로커에 동일하게 설정
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS : "0@Kafka00Service:9093"
      KAFKA_CFG_PROCESS_ROLES : "controller,broker"
      # 리스너 설정
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE : "true"
      ALLOW_PLAINTEXT_LISTENER : "yes"
      KAFKA_CFG_LISTENERS : "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS : "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP : "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES : "CONTROLLER"
      # 클러스터 설정
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR : "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR : "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR : "1"
    networks:
      - kafka_network
    volumes:
      - Kafka00:/bitnami/kafka